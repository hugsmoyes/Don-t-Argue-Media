<style>
:root{--bg:#f2f4f7;--surface:#ffffff;--card:#ffffff;--border:#e2e5eb;--accent:#16a34a;--accent2:#ea580c;--text:#111827;--muted:#6b7280;--green:#22c55e;--red:#dc2626;--gold:#ca8a04;--silver:#9ca3af;--bronze:#92400e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;}
.container{max-width:1100px;margin:0 auto;padding:32px 20px 80px;}
header{border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:28px;}
.badge{display:inline-block;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent);padding:3px 10px;margin-bottom:10px;text-transform:uppercase;}
h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(40px,7vw,68px);letter-spacing:.02em;line-height:.9;margin-bottom:5px;}
h1 span{color:var(--accent);}
.meta{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--muted);}
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);}
.tab{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.on){color:var(--text);}
.panel{display:none;}.panel.on{display:block;}
.bnr{background:var(--surface);border:1px solid var(--border);padding:12px 16px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.bs{text-align:center;}
.bv{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:.05em;color:var(--accent);}
.bl{font-family:"DM Mono",monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px;}
.ctrl{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;align-items:center;}
.sw{flex:1;min-width:160px;position:relative;}
.sw input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"DM Mono",monospace;font-size:12px;padding:8px 10px 8px 28px;outline:none;transition:border-color .2s;}
.sw input:focus{border-color:var(--accent);}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;}
.fbt{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:8px 11px;cursor:pointer;color:var(--muted);border:1px solid var(--border);background:var(--surface);transition:all .18s;white-space:nowrap;}
.fbt.on{color:var(--accent);border-color:var(--accent);background:rgba(22,163,74,.04);}
.fbt:hover:not(.on){color:var(--text);}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;margin-top:4px;}
.st{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.05em;}
.sc{font-family:"DM Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.09em;}
.pl{display:flex;flex-direction:column;gap:5px;margin-bottom:26px;}
.pc{background:var(--card);border:1px solid var(--border);border-left:3px solid transparent;padding:11px 14px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;transition:border-color .15s;}
.pc:hover{border-color:rgba(22,163,74,.25);}
.r1{border-left-color:var(--gold)!important;}.r2{border-left-color:var(--silver)!important;}.r3{border-left-color:var(--bronze)!important;}
.rn{font-family:"Bebas Neue",sans-serif;font-size:20px;text-align:center;color:var(--muted);}
.r1 .rn{color:var(--gold);}.r2 .rn{color:var(--silver);}.r3 .rn{color:var(--bronze);}
.pi{display:flex;flex-direction:column;gap:2px;}
.pn{font-weight:500;font-size:13px;}
.pk{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;}
.pst{font-family:"DM Mono",monospace;font-size:9px;display:flex;gap:7px;flex-wrap:wrap;margin-top:3px;}
.ch{display:flex;flex-direction:column;gap:1px;min-width:26px;}
.cl{font-size:7px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.cv{font-size:11px;color:var(--text);}.cv.o{color:var(--accent2);}.cv.t{color:var(--accent);}.cv.d{color:var(--green);}
.bw{margin-top:4px;height:2px;background:var(--border);overflow:hidden;}
.bf{height:100%;}
.wd{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:70px;}
.wl{font-family:"DM Mono",monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.wv{font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:.03em;line-height:1;}
.wt{font-family:"DM Mono",monospace;font-size:7px;letter-spacing:.07em;padding:1px 5px;border:1px solid;margin-top:2px;text-align:right;}
.ss{font-family:"DM Mono",monospace;font-size:7px;padding:1px 5px;background:rgba(255,107,53,.12);color:#ff6b35;border:1px solid rgba(255,107,53,.3);margin-left:5px;vertical-align:middle;}
.mb{width:100%;padding:9px;background:none;border:1px solid var(--border);color:var(--muted);font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:2px;transition:all .18s;}
.mb:hover{border-color:var(--accent);color:var(--accent);}
/* career specific */
.cc{background:var(--card);border:1px solid var(--border);border-left:3px solid transparent;padding:11px 14px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;margin-bottom:5px;}
.cc:hover{border-color:rgba(22,163,74,.22);}
.bar3{display:flex;gap:2px;margin-top:4px;height:6px;}
.b3s{height:100%;flex:1;border-radius:1px;}
.career-total{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:.03em;line-height:1;color:var(--accent);}
.yr-chips{display:flex;gap:5px;margin-top:3px;}
.yc{font-family:"DM Mono",monospace;font-size:9px;padding:1px 5px;border:1px solid;}
</style>

      <div class="bar3">
        ${p.w24>0?`<div class="b3s" style="background:#44446a;flex:${p.w24/maxW}"></div>`:''}
        ${p.w25>0?`<div class="b3s" style="background:#6666aa;flex:${p.w25/maxW}"></div>`:''}
        ${p.w26>0?`<div class="b3s" style="background:${pc};flex:${p.w26/maxW}"></div>`:''}
      </div>
    </div>
    <div class="wd">
      <div class="wl">Career WAR</div>
      <div class="career-total">+${p.war.toFixed(2)}</div>
    </div>
  </div>`;
}
function rnd26(){
  const q=document.getElementById('srch26').value.toLowerCase();
  const f=D26.filter(p=>(cp26==='all'||p.p===cp26)&&(!q||p.n.toLowerCase().includes(q)||p.t.toLowerCase().includes(q)));
  const top=[...D26].sort((a,b)=>b.war-a.war)[0];
  const elite=f.filter(p=>p.war>=4.0).length;
  const aa=f.filter(p=>p.war>=3.25&&p.war<4.0).length;
  document.getElementById('bnr26').innerHTML=`
    <div class="bs"><div class="bv">${top?top.war.toFixed(2):'—'}</div><div class="bl">Leader WAR</div></div>
    <div class="bs"><div class="bv" style="color:var(--gold);font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500">${top?top.n.split(' ').pop():'—'}</div><div class="bl">Top Player</div></div>
    <div class="bs"><div class="bv">${elite}</div><div class="bl">Elite (4.0+)</div></div>
    <div class="bs"><div class="bv">${aa}</div><div class="bl">AA Contention (3.25+)</div></div>
    <div class="bs"><div class="bv">${f.length}</div><div class="bl">Players</div></div>`;
  let html='';
  if(cp26==='all'){
    const g={};PO.forEach(p=>g[p]=[]);
    f.forEach(p=>{if(g[p.p])g[p.p].push(p);});
    for(const pos of PO){
      const list=g[pos].sort((a,b)=>b.war-a.war);
      if(!list.length)continue;
      const lim=lm26[pos]||10,mw=list[0].war;
      html+=`<div class="sh"><div class="st" style="color:${PC[pos]}">${PL[pos]}</div><div class="sc">${list.length} players</div></div><div class="pl">`;
      list.slice(0,lim).forEach((p,i)=>{html+=card26(p,i+1,mw);});
      html+='</div>';
      if(list.length>lim)html+=`<button class="mb" onclick="lm26['${pos}']=(lm26['${pos}']||10)+20;rnd26()">${list.length-lim} more ↓</button>`;
    }
  }else{
    const list=f.sort((a,b)=>b.war-a.war);
    if(!list.length){document.getElementById('rk26').innerHTML='<div style="color:var(--muted);font-family:"DM Mono",monospace;padding:16px;">No players found.</div>';return;}
    const mw=list[0].war,lim=lm26[cp26]||20;
    html+=`<div class="sh"><div class="st" style="color:${PC[cp26]}">${PL[cp26]}</div><div class="sc">${list.length} players</div></div><div class="pl">`;
    list.slice(0,lim).forEach((p,i)=>{html+=card26(p,i+1,mw);});
    html+='</div>';
    if(list.length>lim)html+=`<button class="mb" onclick="lm26['${cp26}']=(lm26['${cp26}']||20)+20;rnd26()">${list.length-lim} more ↓</button>`;
  }
  document.getElementById('rk26').innerHTML=html||'<div style="color:var(--muted);font-family:"DM Mono",monospace;padding:16px;">No players match.</div>';
}

function rndAll(){
  const q=document.getElementById('srchall').value.toLowerCase();
  const f=[...D26].filter(p=>!q||p.n.toLowerCase().includes(q)||p.t.toLowerCase().includes(q))
    .sort((a,b)=>b.war-a.war);
  const elite=f.filter(p=>p.war>=4.0).length;
  const aa=f.filter(p=>p.war>=3.25&&p.war<4.0).length;
  const top=f[0];
  document.getElementById('bnrall').innerHTML=`
    <div class="bs"><div class="bv">${top?top.war.toFixed(2):'—'}</div><div class="bl">Leader WAR</div></div>
    <div class="bs"><div class="bv" style="color:var(--gold);font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500">${top?top.n.split(' ').pop():'—'}</div><div class="bl">Top Player</div></div>
    <div class="bs"><div class="bv">${elite}</div><div class="bl">Elite (4.0+)</div></div>
    <div class="bs"><div class="bv">${aa}</div><div class="bl">AA Contention (3.25+)</div></div>
    <div class="bs"><div class="bv">${f.length}</div><div class="bl">Players Shown</div></div>`;
  if(!window.limAll)window.limAll=25;
  const slice=f.slice(0,window.limAll);
  const mw=f[0]?f[0].war:1;
  let html=`<div class="sh"><div class="st">Overall WAR Rankings</div><div class="sc">${f.length} players · all positions</div></div><div class="pl">`;
  slice.forEach((p,i)=>{
    const globalRank=i+1+(q?0:0);
    // find actual rank in full unsorted
    const trueRank=[...D26].sort((a,b)=>b.war-a.war).findIndex(x=>x.n===p.n)+1;
    html+=card26(p,q?i+1:trueRank,mw);
  });
  html+='</div>';
  if(f.length>window.limAll)html+=`<button class="mb" onclick="window.limAll=(window.limAll||25)+25;rndAll()">${f.length-window.limAll} more ↓</button>`;
  document.getElementById('rkall').innerHTML=html;
}

rnd26();
</script>
